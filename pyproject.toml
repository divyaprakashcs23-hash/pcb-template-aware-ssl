[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbssl"
version = "1.0.0"
description = "Label-efficient PCB defect detection with template-aware self-supervised pretraining (DeepPCB)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
